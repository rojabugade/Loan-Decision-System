
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Credit Analysis Platform
      APP_VERSION: 0.1.0
      ENVIRONMENT: production
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@db:5432/credit_ai
      REDIS_URL: redis://redis:6379/0
      MODEL_VERSION: gpt-5.3-codex
      PROMPT_VERSION: credit-workflow-v1
      LOW_CONFIDENCE_THRESHOLD: "0.55"
      RETRIEVAL_CACHE_TTL_SECONDS: "300"
      RETRIEVAL_TOP_K: "8"
    depends_on:
      - db
      - redis

  ui:
    build: .
    command: ["streamlit", "run", "/app/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://web:8000
      APP_NAME: Credit Analysis Platform
      APP_VERSION: 0.1.0
      ENVIRONMENT: production
      MODEL_VERSION: gpt-5.3-codex
      PROMPT_VERSION: credit-workflow-v1
      LOW_CONFIDENCE_THRESHOLD: "0.55"
      RETRIEVAL_CACHE_TTL_SECONDS: "300"
      RETRIEVAL_TOP_K: "8"
    depends_on:
      - web

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data:
