services:
  web:
    build: .
    expose:
      - '8000'
    environment:
      APP_NAME: 'Credit Analysis Platform'
      APP_VERSION: 0.1.0
      ENVIRONMENT: production
      POSTGRES_DSN: 'postgresql+psycopg://postgres:postgres@db:5432/credit_ai'
      REDIS_URL: 'redis://redis:6379/0'
      MODEL_VERSION: gpt-5.3-codex
      PROMPT_VERSION: credit-workflow-v1
      LOW_CONFIDENCE_THRESHOLD: '0.55'
      RETRIEVAL_CACHE_TTL_SECONDS: '300'
      RETRIEVAL_TOP_K: '8'
    depends_on:
      - db
      - redis

  db:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'credit_ai'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
      - './sql:/docker-entrypoint-initdb.d'
    expose:
      - '5432'

  redis:
    image: 'redis:7-alpine'
    expose:
      - '6379'

  ui:
    build: .
    command:
      - streamlit
      - run
      - /app/ui/app.py
      - '--server.port'
      - '8501'
      - '--server.address'
      - 0.0.0.0
    expose:
      - '8501'
    environment:
      API_BASE_URL: 'http://web:8000'
    depends_on:
      - web

volumes:
  postgres_data: